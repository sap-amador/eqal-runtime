# EQAL Policy Pack — Supply Chain Execution (v0.3)
# Same structure as policy_ap.yaml. Sections marked FROZEN are byte-identical to the AP pack.
pack: SCM
version: "0.3"
currency: EUR
human_touch_cost: 12.00

# ---- FROZEN: intelligence classes (section 2) -------------------------------
classes:
  D: {name: deterministic,  cost: 0.000, latency_ms: 20}
  S: {name: specialist,     cost: 0.010, latency_ms: 900}
  L: {name: local model,    cost: 0.004, latency_ms: 600}
  F: {name: frontier model, cost: 0.045, latency_ms: 3500}
  M: {name: multi-model,    cost: 0.090, latency_ms: 7000}

# ---- FROZEN: escalation rules (section 5) ------------------------------------
autonomy_order: [NONE, RECOMMEND, ACT_NOTIFY, ACT]    # ordered, [0027]
level_ceiling_values: [0, 1, 2, 3, H]                # H = human-terminated, [0027]
routing_rule: conservative                           # [0031]: below threshold -> most restrictive candidate

# ---- classification ladder ([0030]) ----------------------------------------
classification:
  ladder: [D, S, L]
  threshold: 0.95
  validation: {D: permitted, S: permitted, L: permitted, F: not_permitted}

# ---- risk lens ([0042]) ----------------------------------------------------
risk_lens:
  signals: [supplier_unapproved, sanctions_hit, single_source_part, regulated_part]
  weights: {supplier_unapproved: 0.45, sanctions_hit: 0.60, single_source_part: 0.20, regulated_part: 0.25}
  threshold: 0.60
  demote_to: RECOMMEND

# ---- exception classes with budget vectors (sections 1, 3) -----------------
exception_classes:
  delay_covered:                       # supplier late; safety stock or alternate PO covers it
    path: [D, L]
    level_ceiling: 1
    consequence: 150.00
    budget: {max_cost: 0.020, evidence: 0.97, max_latency_ms: 10000, autonomy: ACT}
    validation: {D: permitted, L: permitted, F: shadow_only}
    human_rule: {role: planner, approvers: 1, when: budget_or_ceiling}
    evidence_required: [stock_position, open_POs, confirmed_dates]

  delay_uncovered:                     # projected shortage at a consuming location
    path: [L, F]
    level_ceiling: 2
    consequence: {fraction_of_line_cost: 1.0, default: 25000.00}
    budget: {max_cost: {fraction_of_consequence: 0.000004, cap: 0.100}, evidence: 0.96, max_latency_ms: 60000, autonomy: ACT_NOTIFY}
    autonomy_rule: {ACT_NOTIFY_if: {delay_days_lte: 3}, otherwise: RECOMMEND}
    validation: {L: permitted, F: permitted}
    human_rule: {role: planner, approvers: 1, when: budget_or_ceiling}
    evidence_required: [projected_stock_by_location, bom_where_used, alternate_supplier_stock]
    shadow_reference: L

  expedite_vs_wait:                    # shortage avoidable at premium freight or overtime
    path: [L, F]
    level_ceiling: 2
    consequence: {fraction_of_line_cost: 1.0, default: 100000.00}
    budget: {max_cost: {fraction_of_consequence: 0.000005, cap: 0.500}, evidence: 0.95, max_latency_ms: 300000, autonomy: ACT_NOTIFY}
    autonomy_rule: {ACT_NOTIFY_if: {premium_lte: 2000, premium_pct_of_order_lte: 0.02}, otherwise: RECOMMEND}
    validation: {L: permitted, F: permitted, M: permitted}
    human_rule: {role: logistics_lead, approvers: 1, when: budget_or_ceiling}
    evidence_required: [shortage_cost, freight_quotes, capacity]
    shadow_reference: L

  substitute_part:                     # approved list grants execution; a model's opinion never does
    path: [D, F]
    level_ceiling: 2
    consequence: 50000.00
    budget: {max_cost: 0.300, evidence: 0.95, max_latency_ms: 1800000, autonomy: ACT_NOTIFY}
    autonomy_rule: {ACT_NOTIFY_if: {on_approved_list: true}, otherwise: RECOMMEND}
    validation: {D: permitted, F: permitted, L: not_permitted}
    human_rule: {role: engineering_and_quality, approvers: 2, when: not_on_approved_list}
    evidence_required: [approved_substitute_list, engineering_change, regulatory_flag]

  quality_hold:
    path: [S, F]
    level_ceiling: H
    consequence: 75000.00
    budget: {max_cost: 0.050, evidence: 0.97, max_latency_ms: 600000, autonomy: NONE}
    validation: {S: permitted, F: permitted}
    human_rule: {role: quality, approvers: 1, when: always}
    evidence_required: [inspection_result, lot_genealogy, usable_stock]

  new_or_changed_source:               # the SC-08 / bank-detail twin: unlimited budget, zero authority
    path: [S, F]
    level_ceiling: H
    consequence: 500000.00
    budget: {max_cost: null, evidence: 0.99, max_latency_ms: null, autonomy: NONE}
    validation: {S: permitted, F: permitted, L: not_permitted}
    human_rule: {role: procurement_and_compliance, approvers: 2, when: always}
    evidence_required: [supplier_qualification, compliance_screen, contract_terms]

# Notes
# - consequence may be a number or {fraction_of_line_cost, default}: the adapter supplies line_cost
#   per case; the default applies when it is absent. max_cost as {fraction_of_consequence, cap}
#   is evaluated per case in v0.4 (at load, with the default, in v0.3).
# - autonomy_rule keys are pack-specific predicates evaluated by the adapter; the runtime only
#   sees true/false per key. This keeps the frozen sections free of process vocabulary.
