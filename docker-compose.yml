services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: eqal, POSTGRES_USER: eqal, POSTGRES_PASSWORD: eqal }
    volumes: [ "eqal-db:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U eqal"], interval: 5s, retries: 10 }
  api:
    build: .
    ports: [ "8000:8000" ]
    environment:
      DATABASE_URL: postgresql://eqal:eqal@db:5432/eqal
      EQAL_POLICY_PACK: ap
      EQAL_PROVIDER: simulated
      EQAL_BOOTSTRAP_TENANT: demo
      EQAL_BOOTSTRAP_API_KEY: demo-key
      EQAL_MATURITY_DAYS: "30"
    depends_on: { db: { condition: service_healthy } }
volumes: { eqal-db: {} }
